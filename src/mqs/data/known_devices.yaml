# Optional enrichment only. Live detection from the device ALWAYS takes precedence;
# the application must work for boards that are not listed here.
#
# SOURCE: MikroTik documentation read 2026-09-15 - the "RouterBoard / Switch-chip
# description" table in *Switch Chip Features*, the models tables in *Marvell Prestera
# switch chip features* and *CRS1xx and 2xx series switches*. Documentation, not devices:
# NUTNO OVĚŘIT (docs/DIALECT_NOTES.md).
#
# Keys are `model` designations from /system routerboard print (RB4011iGS+, E50UG), which
# is what the documentation's RouterBoard column lists. NEVER key on `board-name`: that is
# the marketing name and MikroTik reuses it across revisions with different chips - a
# "hEX S" is RB760iGS with MT7621 or E60iUGS with EN7523 (verified on a device 2026-09-16).
#
# Matching is by longest normalised prefix (case and punctuation ignored), because reported
# names carry suffixes the documentation omits ("RB4011iGS+5HacQ2HnD"). Longest wins, which
# is what keeps RB750Gr3 (MT7621) off the unrelated RB750G (Atheros8316) entry, so always
# add the most specific spelling of a model as its own entry.
#
# Notes are shown in the UI after connecting. Keep them short and in Czech.

