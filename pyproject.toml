[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "mikrotik-quickset-plus"
version = "0.5.1"
description = "Windows GUI for generating and applying baseline MikroTik RouterOS v6/v7 configuration"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "PySide6>=6.7",
    "librouteros>=3.2",
    "paramiko>=3.4",
    "scp>=0.15",
    "PyYAML>=6.0",
    "ifaddr>=0.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "pytest-qt>=4.4",
    "ruff>=0.6",
    "pyinstaller>=6.10",
]

[project.scripts]
mqs-gen = "mqs.generator.cli:main"

[project.gui-scripts]
mqs = "mqs.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mqs"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]  # tests/test_release_notes.py imports tools/
addopts = "-ra"
markers = [
    "qt: GUI smoke tests requiring a Qt platform",
]

[tool.coverage.run]
source = ["mqs"]
branch = true

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "."]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # Czech UI strings contain non-ASCII letters
